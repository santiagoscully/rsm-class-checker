<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#16233b;--muted:#5d6b82;--line:#d6deea;--navy:#1f3b73;--err:#b23a2e}
@media (prefers-color-scheme: dark){:root{--bg:#0f1624;--card:#18223a;--ink:#e7edf7;--muted:#9aa8c0;--line:#2a3754;--navy:#8fb0ff;--err:#ff8a7a;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:1.4rem}p{margin:0;color:var(--muted);font-size:.95rem}
input{font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:700;padding:12px;border:0;border-radius:10px;background:var(--navy);color:var(--card);cursor:pointer}
#err{color:var(--err);min-height:1.2em;font-size:.9rem}
</style></head><body>
<form id="f"><h1>RSM Class Checker</h1><p>Enter the family passcode to see the schedule.</p>
<input id="p" type="password" autocomplete="current-password" placeholder="Passcode" required>
<button>Open</button><div id="err" role="alert"></div></form>
